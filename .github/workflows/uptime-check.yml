name: Uptime Check
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Frontend
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://playmorrow.vercel.app")
          if [ "$status" != "200" ]; then
            echo "FAIL: Frontend (HTTP $status)"
            exit 1
          fi
          echo "OK: Frontend (HTTP $status)"

      - name: Check API Health
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://playmorrow-api-aged-mountain-9542.fly.dev/api/health")
          if [ "$status" != "200" ]; then
            echo "FAIL: API Health (HTTP $status)"
            exit 1
          fi
          echo "OK: API Health (HTTP $status)"

      - name: Check API Games Endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://playmorrow-api-aged-mountain-9542.fly.dev/api/games")
          body=$(curl -s --max-time 15 "https://playmorrow-api-aged-mountain-9542.fly.dev/api/games")
          count=$(echo "$body" | grep -o '"id"' | wc -l)
          if [ "$status" != "200" ]; then
            echo "FAIL: API Games (HTTP $status)"
            exit 1
          fi
          echo "OK: API Games (HTTP $status, $count games)"
