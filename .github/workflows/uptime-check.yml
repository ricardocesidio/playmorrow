name: Uptime Check
on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours (was */5 min — caused email flood during Neon quota outage)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Frontend
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://playmorrow.vercel.app")
          if [ "$status" != "200" ]; then
            echo "FAIL: Frontend (HTTP $status)"
            exit 1
          fi
          echo "OK: Frontend (HTTP $status)"

      - name: Check API Health
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://playmorrow-api-aged-mountain-9542.fly.dev/api/health")
          if [ "$status" != "200" ]; then
            echo "FAIL: API Health (HTTP $status)"
            exit 1
          fi
          echo "OK: API Health (HTTP $status)"

      - name: Check API Games Endpoint (soft — data endpoints may fail during DB maintenance)
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://playmorrow-api-aged-mountain-9542.fly.dev/api/games?pageSize=1")
          if [ "$status" != "200" ]; then
            echo "WARN: API Games (HTTP $status) — data endpoint, non-blocking"
          else
            echo "OK: API Games (HTTP $status)"
          fi
