name: CI

# IMPORTANT: After this workflow is green, enable branch protection on GitHub:
# Settings → Branches → main → Require status checks to pass before merging
# Select: "quality", "backend", "e2e"
#
# Future: add a11y (axe-core or Lighthouse CI) and coverage jobs here (see audit list).

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: any type ratchet (block new any types)
        run: |
          ANY_COUNT=$(grep -r ": any" apps/api/src --include="*.ts" | wc -l | tr -d ' ')
          echo "Current 'any' type count: $ANY_COUNT"
          echo "Baseline: 0 (Session 24 eliminated all legacy any types)"
          if [ "$ANY_COUNT" -gt 0 ]; then
            echo "ERROR: 'any' type count increased from 0 to $ANY_COUNT"
            exit 1
          fi
          echo "PASS: 'any' type count is zero"
      - run: pnpm typecheck
      - name: npm audit (production deps)
        run: pnpm audit --prod --audit-level=critical || echo "::warning::Critical production dependency vulnerabilities found. Run pnpm update and pnpm audit --prod to verify."

  backend:
    name: Backend tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: playmorrow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Use TEST_DATABASE_URL so vitest.setup.ts override + guard is exercised
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/playmorrow_test?schema=public
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/playmorrow_test?schema=public
      JWT_SECRET: test-secret
      # OAuth + CSRF secrets required by getOrThrow() in strategies + CsrfService
      GOOGLE_CLIENT_ID: ci-test
      GOOGLE_CLIENT_SECRET: ci-test
      GITHUB_CLIENT_ID: ci-test
      GITHUB_CLIENT_SECRET: ci-test
      CSRF_SECRET: ci-test-csrf-secret-for-github-actions
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Database safety check (never target production from CI)
        run: |
          if echo "$DATABASE_URL" | grep -qE 'ep-orange-bird-abpuzipk|neon\.tech'; then
            echo "ERROR: DATABASE_URL appears to point at production Neon. CI must use disposable Postgres only."
            exit 1
          fi
          echo "PASS: DATABASE_URL targets non-production database"
      - name: Build api + workspace deps (generates Prisma client)
        run: pnpm exec turbo run build --filter=@playmorrow/api...
      - name: Apply migrations
        run: pnpm --filter @playmorrow/database db:deploy
      - name: Run backend tests
        run: pnpm --filter @playmorrow/api test -- --coverage

  e2e:
    name: E2E (Playwright desktop + mobile)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web + workspace deps
        run: pnpm exec turbo run build --filter=@playmorrow/web...
      - name: Install Playwright browser
        run: pnpm --filter @playmorrow/web exec playwright install --with-deps chromium
      - name: Run E2E (desktop + mobile)
        run: pnpm --filter @playmorrow/web test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
      # TODO (audit 2): Expand e2e for new a11y (tabs, ARIA from B6/B7), run full suite locally with PLAYWRIGHT_DEV=1. Add coverage report. See docs/audit-fixes-summary.md.
      # A11y: placeholder for Lighthouse CI or axe (run on key pages like /games, /feed)
      # - name: A11y check
      #   run: npx @lhci/cli autorun --upload.target=temporary-public-storage || echo "A11y check placeholder"
