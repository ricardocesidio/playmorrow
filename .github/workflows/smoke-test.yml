name: Smoke Tests (pós-deploy)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://playmorrow-api-aged-mountain-9542.fly.dev/api/health")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed: $STATUS"
            exit 1
          fi
          echo "✅ Health check: $STATUS"

      - name: Games endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://playmorrow-api-aged-mountain-9542.fly.dev/api/games?pageSize=1")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Games endpoint failed: $STATUS"
            exit 1
          fi
          RESP=$(curl -s "https://playmorrow-api-aged-mountain-9542.fly.dev/api/games?pageSize=1")
          TOTAL=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('total', 'MISSING'))" 2>/dev/null)
          if [ -z "$TOTAL" ] || [ "$TOTAL" = "MISSING" ]; then
            echo "❌ Games endpoint returned malformed response"
            exit 1
          fi
          echo "✅ Games endpoint: HTTP $STATUS (total=$TOTAL — 0 is valid, post-incident DB is empty)"

      - name: Search endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://playmorrow-api-aged-mountain-9542.fly.dev/api/search?q=test")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Search endpoint failed: $STATUS"
            exit 1
          fi
          echo "✅ Search endpoint: $STATUS"

      - name: Recommendations endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://playmorrow-api-aged-mountain-9542.fly.dev/api/recommendations?type=trending&limit=1")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Recommendations endpoint failed: $STATUS"
            exit 1
          fi
          echo "✅ Recommendations endpoint: $STATUS"

      - name: Frontend health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://playmorrow.vercel.app/")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Frontend health check failed: $STATUS"
            exit 1
          fi
          echo "✅ Frontend: $STATUS"
