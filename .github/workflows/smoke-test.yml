name: Smoke Tests (pós-deploy)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours (was */30 min — caused email flood during Neon quota outage)

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://playmorrow-api-aged-mountain-9542.fly.dev/api/health")
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: Health check failed: $STATUS"
            exit 1
          fi
          echo "OK: Health check: $STATUS"

      - name: Games endpoint (soft)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://playmorrow-api-aged-mountain-9542.fly.dev/api/games?pageSize=1")
          if [ "$STATUS" != "200" ]; then
            echo "WARN: Games endpoint HTTP $STATUS — non-blocking"
          else
            echo "OK: Games endpoint: $STATUS"
          fi

      - name: Search endpoint (soft)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://playmorrow-api-aged-mountain-9542.fly.dev/api/search?q=test")
          if [ "$STATUS" != "200" ]; then
            echo "WARN: Search endpoint HTTP $STATUS — non-blocking"
          else
            echo "OK: Search endpoint: $STATUS"
          fi

      - name: Recommendations endpoint (soft)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://playmorrow-api-aged-mountain-9542.fly.dev/api/recommendations?type=trending&limit=1")
          if [ "$STATUS" != "200" ]; then
            echo "WARN: Recommendations endpoint HTTP $STATUS — non-blocking"
          else
            echo "OK: Recommendations endpoint: $STATUS"
          fi

      - name: Frontend health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://playmorrow.vercel.app/")
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: Frontend health check failed: $STATUS"
            exit 1
          fi
          echo "OK: Frontend: $STATUS"
