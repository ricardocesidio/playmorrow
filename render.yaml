# Render Blueprint — Playmorrow API
# Two services: production (playmorrow-api) and staging (playmorrow-api-staging).
# Create a Neon database branch for staging data.
# Set STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET to Stripe TEST keys for staging.

services:
  - type: web
    name: playmorrow-api
    env: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CSRF_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: WEB_ORIGIN
        value: https://playmorrow.co
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STORAGE_PROVIDER
        value: r2
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: CDN_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: COOKIE_DOMAIN
        value: playmorrow.co
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: openai
  - type: web
    name: playmorrow-api-staging
    env: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CSRF_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: WEB_ORIGIN
        value: https://playmorrow.co
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: openai
