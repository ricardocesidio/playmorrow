# fly.toml app configuration file generated for playmorrow-api-aged-mountain-9542
app = 'playmorrow-api-aged-mountain-9542'
primary_region = 'ams'

[build]
  dockerfile = 'apps/api/Dockerfile'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.health_checks]]
    interval = '15s'
    timeout = '60s'
    grace_period = '60s'
    method = 'GET'
    path = '/api/health'
    protocol = 'http'

[[vm]]
  memory = '512mb'
  cpus = 1
