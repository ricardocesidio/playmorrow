app = 'playmorrow-api-aged-mountain-9542'
primary_region = 'ams'

[build]
  dockerfile = 'apps/api/Dockerfile'

[deploy]
  release_command = "sh -c 'cd packages/database && npx prisma migrate deploy --schema=prisma/schema.prisma'"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = 10000
    timeout = 5000
    grace_period = '30s'
    method = 'get'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpus = 1
